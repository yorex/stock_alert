{
    "rules": {
        "rapicDown": {
            "duration": 3,
            "down":[0.05, 0.02],
            "warn":"rapid v v v"
        },

        "peakDown":{
            "peak":{"width": 30, "height": 0.05},
            "duration":3,
            "down":[0.02, 0.02],
            "warn":"peak v v v"
        },

        "continueDown":{
            "continueDown":[0.005, 0.005, 0.005],
            "duration":4,
            "warn":"continue v v v"
        },

        "acceleratedDown":{
            "continueDown":[0.005, 0.01, 0.02],
            "duration":4,
            "warn":"accelerated v v v"
        },

        "slowDown":{
            "continueDown":[0.02, 0.01, 0.005],
            "duration":4,
            "warn":"slowdown v v v"
        },
 
        "rapicUp": {
            "duration": 3,
            "up":[0.05, 0.02],
            "warn":"rapic ^ ^ ^"
        },

        "peakUp":{
            "peak":{"width": 30, "height": 0.05},
            "duration":3,
            "up":[0.02, 0.02],
            "warn":"peak ^ ^ ^"
        },

        "continueUp":{
            "continueUp":[0.005, 0.005, 0.005],
            "duration":4,
            "warn":"continue ^ ^ ^"
        },

        "acceleratedUp":{
            "continueUp":[0.005, 0.01, 0.02],
            "duration":4,
            "warn":"accelerated ^ ^ ^"
        },

        "slowUp":{
            "continueUp":[0.02, 0.01, 0.005],
            "duration":4,
            "warn":"slowdown ^ ^ ^"
        },



        "peakDown-hsi":{
            "peak":{"width": 30, "height": 0.05},
            "duration":2,
            "down":[0.01],
            "subjects":["^HSI"],
            "warn":"peakDown-hsi v v v"
        },

        "continueDown-hsi":{
            "down":[0.01],
            "duration": 2,
            "subjects":["^HSI"],
            "warn":"continueDown-hsi v v v"
        }



    }
}

