{
    "rules": {
        "rapicDown": {
            "duration": 2,
            "down":[0.05, 0.02],
            "warn":"rapid V; 近2天5%，2%"
        },

        "peakDown":{
            "peak":{"width": 30, "height": 0.05},
            "duration":2,
            "down":[0.02, 0.02],
            "warn":"peak V; 高位5%近2天连续降2%"
        },

        "continueDown":{
            "continueDown":[0.005, 0.005, 0.005],
            "duration":3,
            "warn":"continue V; 连续3天跌"
        },

        "acceleratedDown":{
            "acceleratedDown":[0.005, 0.01, 0.02],
            "duration":3,
            "warn":"accelerated V；连续3天加速下跌"
        },

        "slowDown":{
            "continueDown":[0.02, 0.01, 0.005],
            "duration":3,
            "warn":"slowdown V；连续3天减速下跌"
        },
 
        "rapicUp": {
            "duration": 2,
            "up":[0.05, 0.02],
            "warn":"rapic ^ ^ ^"
        },

        "peakUp":{
            "peak":{"width": 30, "height": 0.05},
            "duration":2,
            "up":[0.02, 0.02],
            "warn":"peak ^; 5%高位连续2天2%增长 "
        },

        "continueUp":{
            "continueUp":[0.005, 0.005, 0.005],
            "duration":3,
            "warn":"continue ^; 连续3天增长 "
        },

        "acceleratedUp":{
            "acceleratedUp":[0.005, 0.01, 0.02],
            "duration":3,
            "warn":"accelerated ^; 连续3天加速增长 "
        },

        "slowUp":{
            "continueUp":[0.02, 0.01, 0.005],
            "duration":3,
            "warn":"slowdown ^; 连续3天减速增长 "
        },



        "peakDown-hsi":{
            "peak":{"width": 30, "height": 0.05},
            "duration":1,
            "down":[0.01],
            "subjects":["^HSI"],
            "warn":"peakDown-hsi v；指数高位下跌；关注风险"
        },

        "KCloseOpenDown-hsi":{
            "seqType": "k:close-open",
            "down":[2], #当前值是前面7天同向结果均值的2倍
            "duration": 12, #因此需要至少8天数据
            "subjects":["^HSI"],
            "warn":"KCloseOpenDown-hsi v; 指数k线突降；减仓, 大概率后面还跌 "
        },

        "continueDown-hsi":{
            "down":[0.01],
            "duration": 1,
            "subjects":["^HSI"],
            "warn":"continueDown-hsi v; 指数下跌报警"
        }
    }
}

